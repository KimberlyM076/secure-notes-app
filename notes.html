<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Lotus Notes</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header>
    <div class="logo-container">
      <img src="images/LotusNotes.png" alt="Lotus Notes Logo" class="logo" />
    </div>

    <nav class="nav-links">
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/notes.html" aria-current="page">Notes</a></li>
      </ul>
    </nav>
  </header>

<main class="page">
  <section class="notes-card">
    <div class="notes-toolbar">
      <h1>Your Notes</h1>
      <p class="subtitle">Create, search, edit, and organize your ideas.</p>
      <p id="guestModeBanner" class="guest-mode-banner" hidden></p>
    </div>

    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Search by title or content..." />
      <button id="clearSearchBtn" class="secondary-btn" type="button">Clear</button>
    </div>
    <p id="notesStatus" class="notes-status" aria-live="polite"></p>

  <!-- Note Creation Form -->
      <div class="note-editor">
        <input id="noteTitle" type="text" placeholder="Note title" required />
        <textarea id="noteContent" placeholder="Write your note..." required></textarea>
        <div class="editor-actions">
          <button id="saveNoteBtn" type="button">Save Note</button>
          <button id="cancelEditBtn" class="secondary-btn" type="button" hidden>Cancel edit</button>
        </div>
      </div>  

  <!-- Notes Display Area -->
      <div id="notesContainer" class="notes-container"></div>

  <!-- Logout Button -->
      <button id="logoutBtn" class="logout-btn" type="button">Logout</button>

  </section>
</main>

<script src="https://cdn.auth0.com/js/auth0-spa-js/2.18/auth0-spa-js.production.js"></script>
<script type="module" src="js/main.js?v=5"></script>

</body>
</html>
