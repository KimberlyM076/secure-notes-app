<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Lotus Notes</title>
<link rel="apple-touch-icon" href="images/LotusNotes.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4CAF50">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="css/style.css">

</head>

<body class="home-page">
<header>

<div class="logo-container">
  <img src="images/LotusNotes.png" alt="Lotus Notes Logo" class="logo">
</div>

<nav class="nav-links">
<ul>
<li><a href="/" aria-current="page">Home</a></li>
<li><button id="guestAccessBtn" class="nav-guest-btn" type="button">Continue as Guest</button></li>

</ul>
</nav>

</header>


<main class="page home-main">
<section class="hero-card">
  <p class="hero-tag">Secure by design</p>
  <h1>Welcome to Lotus Notes</h1>
  <p class="subtitle">Sign up, Login, or Continue as guest to start writing immediately.</p>

  <div class="hero-actions">
    <button id="auth0LoginBtn" type="button" class="secondary-btn">Login</button>
    <button id="auth0SignupBtn" type="button" class="primary-cta">Create account</button>
  </div>
</section>
</main>

<!-- Install the Auth0 SPA SDK -->
<script src="https://cdn.auth0.com/js/auth0-spa-js/2.18/auth0-spa-js.production.js"></script>
<script type="module" src="js/auth.js?v=11"></script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js")
    .then(() => console.log("Service Worker Registered"));
}
</script>

</body>

</html>
